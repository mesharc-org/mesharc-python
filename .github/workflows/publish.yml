name: Publish

# Publishes to PyPI whenever main carries a version the index does not
# have yet. No token is stored: the project trusts this repository and
# workflow on pypi.org (Project → Publishing → GitHub, environment
# "pypi"), and PyPI accepts the workflow's OpenID Connect identity.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build && python -m twine check dist/*
      - name: Is this version already on PyPI?
        id: check
        run: |
          VERSION=$(python -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          if curl -sf "https://pypi.org/pypi/mesharc/$VERSION/json" >/dev/null; then
            echo "mesharc $VERSION is already published"; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing mesharc $VERSION"; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
