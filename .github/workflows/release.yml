name: Release

# A release is a merge to main that changes the version: `detect` finds that
# version untagged, and the jobs below test, build and publish it (publish
# waits for the pypi environment's approval), then create its tag and GitHub
# Release. A merge that leaves the version alone releases nothing. Pushing a
# v* tag by hand still releases that tag, and a run by hand (Actions ->
# Release -> Run workflow) is a rehearsal that never publishes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.d.outputs.mode }}
      tag: ${{ steps.d.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release, rehearsal, or nothing to do
        id: d
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/check_release.py | sed -n 's/^version //p')"
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            mode=tag; tag="$REF_NAME"
          elif [ "$EVENT" = push ]; then
            tag="v$version"
            # Released already (its tag exists): nothing to do. Any answer but
            # "not found" stops the run rather than guessing.
            if out="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1)"; then
              mode=skip
            elif printf '%s' "$out" | grep -q "HTTP 404"; then
              mode=main
            else
              echo "::error::could not tell whether $tag exists: $out"; exit 1
            fi
          else
            mode=rehearsal; tag=""
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version $version: **$mode**${tag:+ ($tag)}" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: detect
    if: needs.detect.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Version, tag and changelog agree
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: python scripts/check_release.py $TAG

  test:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,mcp]"
      - run: ruff check .
      - run: mypy
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: The MCP tools in this build
        # From the wheel just built, not the source tree: run as a script,
        # scripts/mcp_tools.py does not have the repository on its path.
        run: |
          python -m pip install "$(ls dist/*.whl)[mcp]"
          python scripts/mcp_tools.py > mcp-tools.json
          python -c "import json; d = json.load(open('mcp-tools.json')); print(d['version'], d['count'], 'tools')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-tools
          path: mcp-tools.json
          if-no-files-found: error

  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: python -m pip install twine
      - run: python -m twine check --strict dist/*
      - run: ls -l dist/

  publish:
    if: needs.detect.outputs.mode == 'tag' || needs.detect.outputs.mode == 'main'
    needs: [detect, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mesharc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: [detect, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-tools
      - name: Create the GitHub Release
        # A release from main makes its tag here, on the commit that was
        # tested and published (a tag made with this token starts no second
        # run). A tag pushed by hand already exists.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          MODE: ${{ needs.detect.outputs.mode }}
        run: |
          python scripts/check_release.py "$TAG" --notes > notes.md
          if [ "$MODE" = main ]; then where=(--target "$GITHUB_SHA"); else where=(--verify-tag); fi
          gh release create "$TAG" mcp-tools.json --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md "${where[@]}"
