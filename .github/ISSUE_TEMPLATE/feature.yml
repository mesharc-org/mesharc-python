name: Feature request
description: Something the Python client should do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task you are trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could look
      description: A method, an option or a snippet, if you have one in mind.
      render: python
