[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mesharc"
version = "0.3.2"
description = "Python client for the MeshArc API: a URL in, clean content out, and a record of what changed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.25"]

keywords = ["scraping", "crawler", "web-data", "change-detection", "sitemap", "markdown", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=8", "build", "twine", "ruff>=0.16", "mypy>=1.18"]

[project.scripts]
mesharc-mcp = "mesharc.mcp:main"

[project.urls]
Homepage = "https://mesharc.dev"
Documentation = "https://mesharc.dev/docs/sdks"
Source = "https://github.com/mesharc-org/mesharc-python"
Issues = "https://github.com/mesharc-org/mesharc-python/issues"
Privacy = "https://mesharc.dev/legal/privacy"
Security = "https://github.com/mesharc-org/mesharc-python/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
include = ["mesharc*"]

[tool.setuptools.package-data]
mesharc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["mesharc"]
